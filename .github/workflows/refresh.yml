name: Weekly data refresh
on:
  schedule:
    - cron: '0 17 * * 0'   # Sundays 17:00 UTC (10:00 PT)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Refresh data
        run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate generated data
        run: npm -w site run test
      - name: Commit updated data if changed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data.json data/tracker.sqlite
          if git diff --cached --quiet; then
            echo 'No data changes; nothing to commit.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore(data): weekly refresh'
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        # Pin the deploy to the commit we just pushed. gh resolves main's tip
        # asynchronously and can catch the pre-push SHA, so pass the exact SHA
        # as an input rather than letting deploy.yml build main's (lagging) head.
        run: gh workflow run deploy.yml --ref main -f ref='${{ steps.commit.outputs.sha }}'
        env:
          GH_TOKEN: ${{ github.token }}
